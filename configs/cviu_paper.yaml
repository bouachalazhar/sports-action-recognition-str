# Protocol used for the CVIU 2026 experiments.
#
# The same representation block is read by `str-build`, stored in the
# checkpoint by `str-train`, and reused by `str-infer` unless a flag overrides
# it explicitly.
representation:
  walks: 1000
  walk_length: 224
  image_size: 224
  roi_mode: all
  temporal_policy: preserve
  save_points: false

build:
  seed: 17

train:
  model: mobilenet_v4
  epochs: 50
  batch_size: 256
  learning_rate: 0.0001
  weight_decay: 0.0001
  validation_fraction: 0.1
  seed: 17
  pretrained: true
  dropout: 0.0
  class_weights: balanced
  clip_aggregation: vote
  early_stopping_patience: 10

evaluate:
  batch_size: 256
  clip_aggregation: vote

inference:
  seed: 17
  batch_size: 32
  clip_aggregation: vote
