[project]
name = "str-action"
version = "1.1.1"
description = "Recognition of action phases from spatio-temporal intermediate representations in amateur sports competition videos"
readme = "README.md"
authors = [{ name = "Lazhar Bouacha", email = "bouacha.lazhar@icloud.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
keywords = ["computer-vision", "sports", "action-recognition", "random-walk", "str"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "av>=12.1.0,<13",
  "numba>=0.66.0",
  "numpy>=2.2.0",
  "opencv-python-headless>=4.13.0,<5",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "torch>=2.8,<2.14",
  "torchvision>=0.23,<0.29",
  "timm>=1.0.12,<2",
  "tqdm>=4.66.5,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
str-train = "str_action.train:main"
str-evaluate = "str_action.evaluate:main"
str-infer = "str_action.infer:main"
str-build = "str_action.build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/str_action"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
